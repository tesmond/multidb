name: Release

# Cargo.toml's version is the canonical release version.
# On every push to main (and on manual runs) the workflow reads that version:
#   - if tag vX.Y.Z already exists, nothing is built or released;
#   - otherwise it builds macOS + Windows and publishes release vX.Y.Z.
# To release, bump `version` in Cargo.toml and push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      should_release: ${{ steps.read.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          git fetch --tags --force origin
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v$VERSION already exists - Cargo.toml version unchanged, no release"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v$VERSION from Cargo.toml"
          fi

  build:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          sh packaging/macos/bundle.sh
          mkdir -p dist
          cp target/release/MultiDB-*.zip dist/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/multidb.exe -DestinationPath "dist/MultiDB-$env:VERSION-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: multidb-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        # The in-app updater refuses to install a zip without its .sha256.
        run: |
          cd dist
          for f in *.zip; do sha256sum "$f" > "$f.sha256"; done
      - name: Create release
        run: |
          gh release create "v${VERSION}" dist/*.zip dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "multidb v${VERSION}" \
            --generate-notes
