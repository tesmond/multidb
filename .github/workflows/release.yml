name: Release

# Builds macOS + Windows when Cargo.toml is pushed to main, and publishes
# a GitHub release tagged with the version in that file (e.g. 0.3.0 -> v0.3.0).
# If that tag already exists (Cargo.toml changed without a version bump) the
# release step is skipped.

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release_exists: ${{ steps.read.outputs.release_exists }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v$VERSION already exists - build will run but no release will be published"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          sh packaging/macos/bundle.sh
          mkdir -p dist
          cp target/release/MultiDB-*.zip dist/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/multidb.exe -DestinationPath "dist/MultiDB-$env:VERSION-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: multidb-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.release_exists == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        # The in-app updater refuses to install a zip without its .sha256.
        run: |
          cd dist
          for f in *.zip; do sha256sum "$f" > "$f.sha256"; done
      - name: Create release
        run: |
          gh release create "v${VERSION}" dist/*.zip dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "multidb v${VERSION}" \
            --generate-notes
