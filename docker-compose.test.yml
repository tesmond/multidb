# Databases for the result-editing integration tests (`make test-db`).
# Local only: these are not run in CI.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: multidb
      POSTGRES_DB: multidb_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: multidb
      MYSQL_DATABASE: multidb_test
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmultidb --silent"]
      interval: 2s
      timeout: 2s
      retries: 60
