<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>multidb</title>
    <script>
        window.__MULTIDB_STARTUP__ = {
            marks: [],
            mark(name, detail) {
                this.marks.push({
                    name,
                    ms: performance.now(),
                    detail: detail ?? null,
                });
            },
        };
        window.__MULTIDB_STARTUP__.mark("html_head_inline_script");
    </script>
    <style>
        html,
        body,
        #app {
            height: 100%;
            margin: 0;
        }

        body {
            background: #12121a;
            color: #e2e2f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .boot-shell {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #12121a;
            overflow: hidden;
        }

        .boot-workspace {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .boot-nav {
            width: 240px;
            flex: 0 0 240px;
            background: #1a1a24;
            border-right: 1px solid #2e2e40;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .boot-nav-header,
        .boot-tab-bar,
        .boot-output-tabs,
        .boot-status {
            background: #16161f;
            border-bottom: 1px solid #2e2e40;
            color: #888898;
            font-size: 11px;
        }

        .boot-nav-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 32px;
            padding: 0 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .boot-nav-empty {
            padding: 20px 16px;
            text-align: center;
            color: #888898;
            font-size: 12px;
        }

        .boot-main {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }

        .boot-tab-bar {
            display: flex;
            align-items: center;
            height: 31px;
            flex: 0 0 31px;
        }

        .boot-tab {
            height: 100%;
            min-width: 80px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            color: #e2e2f0;
            background: #1e1e2e;
            border-bottom: 2px solid #6366f1;
            font-size: 12px;
        }

        .boot-add {
            padding: 0 12px;
            color: #888898;
            font-size: 14px;
        }

        .boot-editor {
            flex: 0.55 0 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888898;
            background: #0f0f17;
            font-size: 12px;
        }

        .boot-splitter {
            height: 4px;
            flex: 0 0 4px;
            background: #2e2e40;
        }

        .boot-output {
            flex: 0.45 0 0;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            background: #12121a;
        }

        .boot-output-tabs {
            display: flex;
            height: 31px;
            flex: 0 0 31px;
        }

        .boot-output-tab {
            display: flex;
            align-items: center;
            padding: 0 16px;
            color: #888898;
            border-bottom: 2px solid transparent;
            font-size: 12px;
        }

        .boot-output-tab.active {
            color: #e2e2f0;
            border-bottom-color: #6366f1;
        }

        .boot-output-body {
            padding: 8px 12px;
            color: #888898;
            font-size: 12px;
        }

        .boot-status {
            height: 24px;
            flex: 0 0 24px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            border-top: 1px solid #2e2e40;
            border-bottom: 0;
        }

        .boot-muted {
            color: #888898;
            font-size: 13px;
        }
    </style>
</head>
<body>
<script>
    window.__MULTIDB_STARTUP__?.mark("body_start");
    requestAnimationFrame(() => {
        window.__MULTIDB_STARTUP__?.mark("static_shell_first_animation_frame");
        requestAnimationFrame(() => {
            window.__MULTIDB_STARTUP__?.mark("static_shell_text_first_visible");
        });
    });
</script>
<div id="app">
    <div class="boot-shell">
        <div class="boot-workspace">
            <aside class="boot-nav">
                <div class="boot-nav-header">
                    <span>Connections</span>
                    <span>+</span>
                </div>
                <div class="boot-nav-empty">
                    <p>No connections.</p>
                    <div class="boot-muted">+ New Connection</div>
                </div>
            </aside>
            <main class="boot-main">
                <div class="boot-tab-bar">
                    <div class="boot-tab">Query</div>
                    <div class="boot-add">+</div>
                </div>
                <div class="boot-editor">Loading editor...</div>
                <div class="boot-splitter"></div>
                <section class="boot-output">
                    <div class="boot-output-tabs">
                        <div class="boot-output-tab active">Results</div>
                        <div class="boot-output-tab">Messages</div>
                        <div class="boot-output-tab">History</div>
                        <div class="boot-output-tab">Saved</div>
                    </div>
                    <div class="boot-output-body">No results.</div>
                </section>
            </main>
        </div>
        <footer class="boot-status">Ready</footer>
    </div>
</div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
