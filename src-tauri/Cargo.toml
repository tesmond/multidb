[package]
name = "multidb"
version = "0.1.0"
description = "A fast desktop SQL client for multiple database engines"
authors = ["multidb contributors"]
edition = "2021"

[lib]
name = "multidb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "multidb"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
dirs = "6"
flate2 = "1"
futures-util = "0.3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "mysql", "postgres", "sqlite", "chrono", "json", "bigdecimal", "uuid"] }
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "sync", "time"] }
tokio-util = "0.7"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
