[package]
name = "multidb"
version = "0.3.0"
description = "A fast desktop SQL client for multiple database engines"
authors = ["multidb contributors"]
edition = "2021"

[lib]
name = "multidb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "multidb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-rds = "1"
dirs = "6"
flate2 = "1"
futures = "0.3"
futures-util = "0.3"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
chrono = "0.4"
regex = "1"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native"] }
rfd = "0.15"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "mysql", "postgres", "sqlite", "chrono", "json", "bigdecimal", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSColorPanel", "NSColorSpace", "NSPanel", "NSResponder", "NSWindow"] }

[build-dependencies]
embed-resource = "3.0.9"
