[package]
name = "multidb"
version = "0.3.0"
description = "A fast desktop SQL client for multiple database engines"
authors = ["multidb contributors"]
edition = "2021"

[lib]
name = "multidb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "multidb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "6"
flate2 = "1"
futures-util = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
keyring = { version = "3", features = ["apple-native"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "mysql", "postgres", "sqlite", "chrono", "json", "bigdecimal", "uuid"] }
tao = "0.35.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = "2"
wry = { version = "0.55.1", features = ["devtools"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSEvent", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSObjCRuntime"] }

[build-dependencies]
embed-resource = "3.0.9"
